<!DOCTYPE html>
<html>
<head>
  <title>My Digital Zoo Manager</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: aliceblue;
      text-align: center;
      color: #222222;
    }

    h1 {
      color: darkgreen;
    }

    #zoo {
      width: 420px;
      border: 3px solid darkgreen;
      border-radius: 12px;
      background-color: white;
      margin: 20px auto;
      padding: 15px;
    }

    .zone {
      border: 2px solid seagreen;
      border-radius: 8px;
      margin: 10px;
      padding: 12px;
      background-color: #f0fff0;
      text-align: left;
    }

    .animal {
      font-weight: bold;
      color: brown;
    }

    button {
      background-color: darkgreen;
      color: white;
      border: none;
      border-radius: 20px;
      padding: 10px 22px;
      cursor: pointer;
      font-weight: bold;
    }

    #output {
      width: 420px;
      border: 2px dashed darkgreen;
      border-radius: 10px;
      background-color: #ffffff;
      margin: 20px auto;
      padding: 12px;
      text-align: left;
    }
  </style>
</head>

<body>

  <h1>My Digital Zoo Manager</h1>

  <p>
    Use JavaScript and the DOM to explore animals, zones, parent nodes,
    child nodes, and sibling nodes.
  </p>

  <div id="zoo">

    <div class="zone" id="PeacockZone">
      <h2>Peacock Zone</h2>
      <p>Animal: <span class="animal">Peacock</span></p>
    </div>

    <div class="zone" id="TigerZone">
      <h2>Tiger Zone</h2>
      <p>Animal: <span class="animal">Tiger</span></p>
    </div>

    <div class="zone" id="CapybaraZone">
      <h2>CapyBara Zone</h2>
      <p>Animal: <span class="animal">Capybara</span></p>
    </div>

  </div>

  <button onclick="manageZoo()">Manage Zoo</button>

  <div id="output">
    Zoo information will appear here.
  </div>

  <script>
    function manageZoo() {

      
      let zoo = document.getElementById("zoo");
      let PeacockZone = document.getElementById("PeacockZone");
      let TigerZone = document.getElementById("TigerZone");
      let CapybaraZone = document.getElementById("CapybaraZone");
      let output = document.getElementById("output");

      
      let parentNodeName = PeacockZone.parentNode.id;

      
      let firstChildZone = zoo.children[0].id;
      let secondChildZone = zoo.children[1].id;
      let nextSiblingZone = PeacockZone.nextElementSibling.id;
      let previousSiblingZone = CapybaraZone.previousElementSibling.id;

      
      let elementNodeType = PeacockZone.nodeType;
      let textNodeType = PeacockZone.firstChild.nodeType;

      
      PeacockZone.style.backgroundColor = "#fff3cd";
      TigerZone.style.backgroundColor = "#d1ecf1";
      CapybaraZone.style.backgroundColor = "#f8d7da";

      PeacockZone.querySelector("h2").innerHTML = "Updated Peacock Zone";
      TigerZone.querySelector("h2").innerHTML = "Updated Tiger Zone";
      CapybaraZone.querySelector("h2").innerHTML = "Updated Capybara Zone";

      output.innerHTML =
        "<strong>DOM Tree Information:</strong><br>" +
        "Parent of Peacock Zone: " + parentNodeName + "<br>" +
        "First child of Zoo: " + firstChildZone + "<br>" +
        "Second child of Zoo: " + secondChildZone + "<br><br>" +

        "<strong>Sibling Node Information:</strong><br>" +
        "Next sibling of Peacock Zone: " + nextSiblingZone + "<br>" +
        "Previous sibling of Capybara Zone: " + previousSiblingZone + "<br><br>" +

        "<strong>Types of Nodes:</strong><br>" +
        "Peacock Zone element node type: " + elementNodeType + "<br>" +
        "Peacock Zone first child text node type: " + textNodeType + "<br><br>" +

        "<strong>DOM Update:</strong><br>" +
        "The animal zone headings and background colours were updated using JavaScript.";
    }
  </script>

</body>
</html>
