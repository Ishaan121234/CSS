<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Zoo</title>

    <style>
        body {

            font-family: Arial, sans-serif;

            background: aliceblue;

            text-align: center;

            padding: 30px;

        }

        h1 {

            color: brown;

        }

        #zoo {

            border: 2px solid purple;

            width: 300px;

            margin: 16px auto;

            padding: 12px;

            border-radius: 10px;

            background: white;

        }

        .zone {

            border: 1px solid yellowgreen;

            margin: 6px 0;

            padding: 8px 12px;

            border-radius: 6px;

            text-align: left;

        }

        button {

            background: green;

            color: white;

            padding: 10px 24px;

            border: none;

            border-radius: 20px;

            cursor: pointer;

            

        }

         button {

            background: red;

            color: white;

            padding: 10px 24px;

            border: none;

            border-radius: 20px;

            cursor: pointer;

            

        }
    </style>

</head>

<body>
    <h1>My Zoo </h1>

    <p>Use JavaScript and the DOM to add animals to each cage!</p>

    <div id="zoo">

        <div class="zone">Zone 1: <span id="zone1"></span></div>

        <div class="zone">Zone 2: <span id="zone2"></span></div>

        <div class="zone">Zone 3: <span id="zone3"></span></div>

        <div class="zone">Zone 4: <span id="zone4"></span></div>

        <div class="zone">Zone 5: <span id="zone5"></span></div>

        <div class="zone">Zone 6: <span id="zone6"></span></div>

        <div class="zone">Total Animals: <span id="total"></span></div>

    </div>

    <br>

    <button onclick="openZoo()">Open the Zoo!</button>
    <button onclick="openZoo1()">Beware of the Animals</button>

    <p id="zoo-status"></p>
    <p id="zoo-status1"></p>


    <script>

        function openZoo() {
            document.getElementById("zone1").innerHTML = "Lion";

            document.getElementById("zone2").innerHTML = "Elephant";

            document.getElementById("zone3").innerHTML = "Penguin";

            document.getElementById("zone4").innerHTML = "Capybara";

            document.getElementById("zone5").innerHTML = "Tiger";

            document.getElementById("zone6").innerHTML = "Horse";

            document.getElementById("total").innerHTML = "6";

            document.getElementById("zoo-status").innerHTML = document.title + " is now Open!!!";

        
            
        }

        function openZoo1() {

document.getElementById("zoo-status1").innerHTML = document.title+ " Beware of the Animals,it might bite u!!!";

        }

    </script>


</body>

</html>
