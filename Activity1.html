<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        body {

            font-family: Arial, sans-serif;

            background: aliceblue;

            text-align: center;

            padding: 30px;

        }

        h1 {

            color: rgb(128, 83, 0);

        }

        button {

            background: yellowgreen;

            color: white;

            padding: 10px 25px;

            border: none;

            border-radius: 20px;

            cursor: pointer;

        }

        div {

            border: 1px solid green;

            width: 280px;

            margin: 6px auto;

            padding: 8px 12px;

            text-align: left;

            border-radius: 6px;

        }
    </style>
</head>

<body>

    <h1>My Game Profile</h1>

    <button onclick="showProfile()">Show Profile</button>

    <div>Name: <span id="name"></span></div>

    <div>Score: <span id="score"></span></div>

    <div>Top Score: <span id="record"></span></div>

    <div>Rank: <span id="rank"></span></div>

    <div>Greeting: <span id="greeting"></span></div>

    <div>Stars: <span id="stars"></span></div>

    <div>Bonus Level: <span id="bonus"></span></div>

    <div>Team Name: <span id="team"></span></div>

    <div>Country Name: <span id="country"></span></div>

    <div>Olympics win/lose: <span id="olympics"></span></div>

    <script>
        function showProfile() {
            let name = "Ishaan";
            let country = "India";
            let myScore = 75;
            let highScore = 100;
            let bonus = null;
            let team;

            let isTopScore = myScore == highScore;

            let rank;
            if (myScore >= 80) {
                rank = "Gold";
            } else if (myScore >= 50) {
                rank = "Silver";
            } else {
                rank = "Bronze";
            }
            document.getElementById("rank").innerHTML = rank;

            let olympics;
            if (myScore >= 70) {
                olympics = "Win";
            } else {
                olympics = "Lose";
            }
            document.getElementById("olympics").innerHTML = olympics;

            let hour = new Date().getHours();
            let greeting;
            if (hour < 12) {
                greeting = "Good Morning!*";
            } else if (hour < 17) {
                greeting = "Good Afternoon!*";
            } else {
                greeting = "Good Evening!*";
            }
            document.getElementById("greeting").innerHTML = greeting;

            let stars = "";
            let count = 0;
            while (count < 5) {
                stars = stars + "* ";
                count = count + 1;
            }
            document.getElementById("stars").innerHTML = stars;



            document.getElementById("bonus").innerHTML = bonus;


            document.getElementById("team").innerHTML = team;




            document.getElementById("name").innerHTML = name;
            document.getElementById("score").innerHTML = myScore + " out of " + highScore;
            document.getElementById("record").innerHTML = isTopScore;
            document.getElementById("rank").innerHTML = rank;
            document.getElementById("greeting").innerHTML = greeting;
            document.getElementById("stars").innerHTML = stars;
            document.getElementById("bonus").innerHTML = bonus;
            document.getElementById("team").innerHTML = team;
            document.getElementById("country").innerHTML = country;

        }
    </script>
</body>

</html>
